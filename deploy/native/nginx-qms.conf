# PhilHealth QMS: native (non-Docker) equivalent of deploy/nginx/qms.conf.
# Installed by install-native.sh as /etc/nginx/sites-available/philhealth-qms.conf (Debian/Ubuntu,
# linked from sites-enabled) or /etc/nginx/conf.d/philhealth-qms.conf (RHEL family).
#   TLS certificate: /opt/philhealth-qms/tls/qms.crt and qms.key (issued by PhilHealth's CA)
#   Web UI (built frontend dist/): /opt/philhealth-qms/web
#   API: qms-api.service on 127.0.0.1:8080
# Differences from the Docker proxy: the SPA is served from disk instead of a 'web' container, and
# HTTP/2 is enabled with 'listen ... http2' because the distribution nginx packages (Ubuntu 24.04:
# 1.24, RHEL 9: 1.20-1.24) predate the 'http2 on;' directive (nginx 1.25.1). Like the Docker proxy it
# listens on IPv4 only; add 'listen [::]:443 ssl http2;' if the host uses IPv6.

upstream qms_api {
    server 127.0.0.1:8080;
}

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    ssl_certificate     /opt/philhealth-qms/tls/qms.crt;
    ssl_certificate_key /opt/philhealth-qms/tls/qms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 210m;
    server_tokens off;

    # Security headers. Do not use add_header inside the location blocks below: nginx would then
    # drop these server-level headers for that location.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'" always;

    # proxy_set_header is inherited only by locations that set none of their own; /ws repeats them.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/  { proxy_pass http://qms_api; proxy_read_timeout 60s; }
    location /ws    { proxy_pass http://qms_api; proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
                      proxy_read_timeout 1h; }
    # Health is public; other actuator endpoints are not exposed outside the host.
    location = /actuator/health { proxy_pass http://qms_api; }
    location /actuator/ { deny all; }
    # Only answered when QMS_API_DOCS_ENABLED=true (404 otherwise).
    location /swagger-ui/ { proxy_pass http://qms_api; }
    location /v3/api-docs { proxy_pass http://qms_api; }

    # Single-page app. Hashed build assets are cached; index.html is always revalidated.
    root /opt/philhealth-qms/web;
    location /assets/ { expires 30d; try_files $uri =404; }
    location = /index.html { expires -1; }
    location / { try_files $uri /index.html; }
}
