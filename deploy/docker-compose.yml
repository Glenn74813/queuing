# Site node (one per LHIO / Regional Office): PostgreSQL + API + web UI + TLS reverse proxy.
# The same file runs the central node with QMS_NODE_ROLE=CENTRAL in the env file.
# Usage:  cp env/site.env.example env/site.env  (fill in values)
#         docker compose --env-file env/site.env up -d
name: philhealth-qms

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: ${QMS_DB_OWNER:-qms_owner}
      POSTGRES_PASSWORD: ${QMS_DB_OWNER_PASSWORD:?set QMS_DB_OWNER_PASSWORD}
      QMS_DB_USER: ${QMS_DB_USER:-qms_app}
      QMS_DB_PASSWORD: ${QMS_DB_PASSWORD:?set QMS_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d qms"]
      interval: 10s
      retries: 5
    networks: [internal]

  api:
    image: philhealth/qms-backend:${QMS_VERSION:-latest}
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: ${QMS_ENV_FILE:-env/site.env}
    environment:
      QMS_DB_URL: jdbc:postgresql://db:5432/qms
      # Flyway migrations run as the schema owner; the app itself connects as QMS_DB_USER (DML only).
      SPRING_FLYWAY_USER: ${QMS_DB_OWNER:-qms_owner}
      SPRING_FLYWAY_PASSWORD: ${QMS_DB_OWNER_PASSWORD}
      QMS_MEDIA_DIR: /opt/qms/data/media
      QMS_REPORTS_DIR: /opt/qms/data/reports
    volumes:
      - media:/opt/qms/data/media
      - reports:/opt/qms/data/reports
    networks: [internal]

  web:
    image: philhealth/qms-frontend:${QMS_VERSION:-latest}
    build: ../frontend
    restart: unless-stopped
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/qms.conf:/etc/nginx/conf.d/default.conf:ro
      - ${QMS_TLS_DIR:-./tls}:/etc/nginx/tls:ro
    networks: [internal]

volumes:
  db-data:
  media:
  reports:

networks:
  internal:
