# TLS-terminating reverse proxy. Certificates: /etc/nginx/tls/qms.crt and qms.key
# (issued by PhilHealth's CA for the site host name).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/tls/qms.crt;
    ssl_certificate_key /etc/nginx/tls/qms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 210m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/  { proxy_pass http://api:8080; proxy_read_timeout 60s; }
    # Setting any proxy_set_header here stops inheritance of the server-level ones, so repeat them.
    location /ws    { proxy_pass http://api:8080; proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_read_timeout 1h; }
    # Health is public; other actuator endpoints are not exposed outside the host.
    location = /actuator/health { proxy_pass http://api:8080; }
    location /actuator/ { deny all; }
    location /swagger-ui/ { proxy_pass http://api:8080; }
    location /v3/api-docs { proxy_pass http://api:8080; }
    location /      { proxy_pass http://web:8081; }
}
